<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>404 — Signal Not Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0e0f10;
    --panel: #17181b;
    --rule: #26272b;
    --ink: #e8e6e1;
    --ink-2: #b6b3ac;
    --ink-3: #7b7871;
    --ink-4: #4b4a46;
    --accent: #6fb7c3;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --serif: 'Instrument Serif', 'Times New Roman', serif;
    --grid: rgba(255,255,255,0.035);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    display: flex;
    align-items: center;
    justify-content: center;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-font-smoothing: antialiased;
  }
  .box {
    text-align: center;
    max-width: 520px;
    padding: 40px;
  }
  .code {
    font-family: var(--serif);
    font-size: clamp(96px, 18vw, 180px);
    line-height: 0.9;
    letter-spacing: -0.03em;
    color: var(--ink);
    margin: 0 0 24px;
  }
  .code span { color: var(--accent); }
  .msg {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 36px;
  }
  .desc {
    font-family: var(--serif);
    font-size: 22px;
    color: var(--ink-2);
    line-height: 1.4;
    margin-bottom: 40px;
    font-style: italic;
  }
  a.back {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
    text-decoration: none;
    padding: 10px 22px;
    border: 1px solid var(--rule);
    transition: all .2s;
  }
  a.back:hover {
    color: var(--accent);
    border-color: var(--accent);
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    display: inline-block;
    margin-bottom: 24px;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%     { opacity: .35; }
  }
  ::selection { background: var(--accent); color: #1a1306; }
</style>
</head>
<body>
  <div class="box">
    <div class="dot"></div>
    <div class="code">4<span>0</span>4</div>
    <div class="msg">Signal Not Found</div>
    <div class="desc">The route you requested doesn't resolve to any known position. Check the address or return to base.</div>
    <a class="back" href="/">← Return to Operator</a>
  </div>
</body>
</html>
